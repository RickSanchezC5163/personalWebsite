<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人学习与论文博客</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-grid"></div>
    <header class="hero container">
      <p class="eyebrow">PERSONAL KNOWLEDGE HUB</p>
      <h1>学习资料 + 论文阅读博客</h1>
      <p class="intro">
        用标签管理你的知识资产，沉淀每次论文阅读的思考。页面风格以「科技感」为主，适合直接部署到
        GitHub Pages（github.io）。
      </p>
    </header>

    <main class="container">
      <section class="panel">
        <div class="section-title-row">
          <h2>📚 学习资料库</h2>
          <p>按标签快速筛选。</p>
        </div>
        <div id="resource-tags" class="tag-list"></div>
        <div id="resource-list" class="card-grid"></div>
      </section>

      <section class="panel">
        <div class="section-title-row">
          <h2>🧪 论文阅读博客</h2>
          <p>记录方法、启发与可落地方向。</p>
        </div>
        <div id="blog-tags" class="tag-list"></div>
        <div id="blog-list" class="card-grid"></div>
      </section>
    </main>

    <footer class="container footer">
      <p>Built for GitHub Pages · 你可以持续往 <code>content.js</code> 里增加内容。</p>
    </footer>

    <script src="content.js"></script>
    <script src="script.js"></script>
  </body>
</html>
